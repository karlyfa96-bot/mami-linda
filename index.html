<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mami Linda</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --fondo: #f6f3ee;
      --tarjeta: #ffffff;
      --texto: #2f2e2c;
      --gris: #77736e;
      --verde: #547d6b;
      --verde-claro: #e7f1ec;
      --rojo: #b85555;
      --rojo-claro: #fae7e7;
      --borde: #e5dfd8;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .contenedor {
      max-width: 700px;
      margin: auto;
      padding: 20px 15px 60px;
    }

    header {
      text-align: center;
      margin: 10px 0 22px;
    }

    .corazon {
      font-size: 46px;
    }

    h1 {
      margin: 5px 0;
      font-size: 28px;
    }

    header p {
      margin: 5px 0;
      color: var(--gris);
    }

    .tarjeta {
      background: var(--tarjeta);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 15px;
      border: 1px solid var(--borde);
      box-shadow: 0 4px 15px rgba(0,0,0,.04);
    }

    .dias {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }

    .dia {
      flex: 0 0 auto;
      min-width: 88px;
      padding: 10px;
      border-radius: 13px;
      border: 1px solid var(--borde);
      background: white;
      text-align: center;
      cursor: pointer;
    }

    .dia.activo {
      background: var(--verde);
      color: white;
      border-color: var(--verde);
    }

    .dia strong {
      display: block;
      font-size: 13px;
    }

    .dia span {
      display: block;
      font-size: 12px;
      margin-top: 3px;
      opacity: .8;
    }

    h2 {
      font-size: 19px;
      margin: 0 0 13px;
    }

    .cabecera-cobertura {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    #porcentaje {
      font-size: 24px;
      font-weight: bold;
      color: var(--verde);
    }

    .barra {
      height: 13px;
      background: #eee9e3;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    #barraInterior {
      height: 100%;
      width: 0%;
      background: var(--verde);
      transition: .3s;
    }

    #textoCobertura {
      margin-top: 10px;
      color: var(--gris);
      font-size: 14px;
    }

    .faltantes {
      background: var(--rojo-claro);
      border-radius: 13px;
      padding: 13px;
      margin-top: 14px;
    }

    .faltantes strong {
      color: var(--rojo);
    }

    .franja-faltante {
      margin-top: 6px;
      font-weight: 600;
    }

    .completo {
      background: var(--verde-claro);
      color: var(--verde);
      padding: 13px;
      border-radius: 13px;
      margin-top: 14px;
      font-weight: bold;
    }

    .turno {
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .turno-arriba {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .nombre {
      font-weight: 750;
      font-size: 17px;
    }

    .horario {
      margin-top: 5px;
      color: var(--verde);
      font-weight: 650;
      font-size: 14px;
    }

    .nota {
      margin-top: 6px;
      color: var(--gris);
      font-size: 14px;
    }

    .eliminar {
      border: none;
      background: none;
      font-size: 18px;
      color: #999;
      cursor: pointer;
    }

    .vacio {
      color: var(--gris);
      text-align: center;
      padding: 18px 0;
    }

    label {
      display: block;
      margin-top: 13px;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      border: 1px solid var(--borde);
      font-size: 16px;
      background: white;
    }

    .horas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .boton {
      width: 100%;
      margin-top: 18px;
      border: none;
      border-radius: 14px;
      padding: 15px;
      background: var(--verde);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .ayuda {
      font-size: 13px;
      color: var(--gris);
      margin-top: 13px;
      line-height: 1.4;
    }

    #estado {
      text-align: center;
      color: var(--gris);
      font-size: 12px;
      margin-top: 20px;
    }

    #toast {
      display: none;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 25px;
      background: #252525;
      color: white;
      padding: 12px 18px;
      border-radius: 30px;
      z-index: 999;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <header>
    <div class="corazon">❤️</div>
    <h1>Mami Linda</h1>
    <p>Organicemos su acompañamiento las 24 horas</p>
  </header>


  <div class="tarjeta">
    <div class="dias" id="dias"></div>
  </div>


  <div class="tarjeta">

    <div class="cabecera-cobertura">

      <div>
        <h2>Cobertura del día</h2>
        <div id="fechaSeleccionada"></div>
      </div>

      <div id="porcentaje">0%</div>

    </div>

    <div class="barra">
      <div id="barraInterior"></div>
    </div>

    <div id="textoCobertura">
      Calculando...
    </div>

    <div id="detalleCobertura"></div>

  </div>


  <div class="tarjeta">

    <h2>👥 Turnos confirmados</h2>

    <div id="listaTurnos">
      <div class="vacio">Cargando...</div>
    </div>

  </div>


  <div class="tarjeta">

    <h2>➕ Me apunto</h2>

    <form id="formulario">

      <label>Tu nombre</label>

      <input
        id="nombre"
        type="text"
        placeholder="Ej. Karla"
        required
      >


      <div class="horas">

        <div>
          <label>Desde</label>

          <input
            id="inicio"
            type="time"
            required
          >
        </div>


        <div>
          <label>Hasta</label>

          <input
            id="fin"
            type="time"
            required
          >
        </div>

      </div>


      <label>Nota opcional</label>

      <textarea
        id="nota"
        rows="2"
        placeholder="Ej. Llego después del trabajo"
      ></textarea>


      <button class="boton" type="submit">
        Confirmar mi turno
      </button>

    </form>

    <div class="ayuda">
      Si el turno pasa de medianoche, por ejemplo
      <strong>10:00 p. m. → 6:00 a. m.</strong>,
      la aplicación lo calcula automáticamente.
    </div>

  </div>


  <div id="estado">
    Conectando con el calendario...
  </div>

</div>


<div id="toast"></div>


<script type="module">

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getDatabase,
    ref,
    push,
    onValue,
    remove
  }
  from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


  /* FIREBASE YA CONFIGURADO */

  const firebaseConfig = {
    apiKey: "AIzaSyChrB7sx9UwPj1R3f-IuTyfmD5GMNC3DaY",
    authDomain: "mami-linda.firebaseapp.com",
    databaseURL: "https://mami-linda-default-rtdb.firebaseio.com",
    projectId: "mami-linda",
    storageBucket: "mami-linda.firebasestorage.app",
    messagingSenderId: "597673959680",
    appId: "1:597673959680:web:d333d81bfd39f46f4e13e5"
  };


  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const turnosRef = ref(db, "turnos");


  let turnos = {};
  let fechaSeleccionada = fechaLocal(new Date());


  const dias = document.getElementById("dias");
  const listaTurnos = document.getElementById("listaTurnos");
  const formulario = document.getElementById("formulario");

  const porcentaje = document.getElementById("porcentaje");
  const barraInterior = document.getElementById("barraInterior");
  const textoCobertura = document.getElementById("textoCobertura");
  const detalleCobertura = document.getElementById("detalleCobertura");

  const fechaSeleccionadaTexto =
    document.getElementById("fechaSeleccionada");

  const estado =
    document.getElementById("estado");


  function fechaLocal(fecha) {

    const y = fecha.getFullYear();

    const m =
      String(fecha.getMonth() + 1)
      .padStart(2, "0");

    const d =
      String(fecha.getDate())
      .padStart(2, "0");

    return `${y}-${m}-${d}`;
  }


  function fechaDesdeTexto(texto) {

    const [y, m, d] =
      texto.split("-").map(Number);

    return new Date(
      y,
      m - 1,
      d
    );
  }


  function sumarDias(texto, cantidad) {

    const fecha =
      fechaDesdeTexto(texto);

    fecha.setDate(
      fecha.getDate() + cantidad
    );

    return fechaLocal(fecha);
  }


  function fechaBonita(texto) {

    return fechaDesdeTexto(texto)
      .toLocaleDateString(
        "es-CR",
        {
          weekday: "long",
          day: "numeric",
          month: "long"
        }
      );
  }


  function minutos(hora) {

    const [h, m] =
      hora.split(":").map(Number);

    return h * 60 + m;
  }


  function horaBonita(total) {

    if (total >= 1440) {
      return "12:00 a. m.";
    }

    const hora =
      Math.floor(total / 60);

    const minuto =
      total % 60;

    const fecha =
      new Date();

    fecha.setHours(
      hora,
      minuto,
      0,
      0
    );

    return fecha.toLocaleTimeString(
      "es-CR",
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );
  }


  function horaDesdeTexto(texto) {

    return horaBonita(
      minutos(texto)
    );
  }


  function renderDias() {

    dias.innerHTML = "";

    const hoy =
      new Date();


    for (let i = 0; i < 14; i++) {

      const fecha =
        new Date(hoy);

      fecha.setDate(
        hoy.getDate() + i
      );


      const textoFecha =
        fechaLocal(fecha);


      const boton =
        document.createElement("button");


      boton.className =
        "dia" +
        (
          textoFecha === fechaSeleccionada
          ? " activo"
          : ""
        );


      const nombreDia =
        i === 0
        ? "HOY"
        : fecha
            .toLocaleDateString(
              "es-CR",
              { weekday: "short" }
            )
            .replace(".", "")
            .toUpperCase();


      const fechaCorta =
        fecha.toLocaleDateString(
          "es-CR",
          {
            day: "numeric",
            month: "short"
          }
        );


      boton.innerHTML = `
        <strong>${nombreDia}</strong>
        <span>${fechaCorta}</span>
      `;


      boton.onclick = () => {

        fechaSeleccionada =
          textoFecha;

        renderTodo();
      };


      dias.appendChild(boton);
    }
  }


  function segmentosDelDia(fecha) {

    const resultado = [];

    const ayer =
      sumarDias(fecha, -1);


    Object.entries(turnos)
    .forEach(([id, turno]) => {

      const inicio =
        minutos(turno.inicio);

      const fin =
        minutos(turno.fin);


      if (
        turno.fecha === fecha &&
        fin > inicio
      ) {

        resultado.push({
          inicio,
          fin
        });
      }


      if (
        turno.fecha === fecha &&
        fin <= inicio
      ) {

        resultado.push({
          inicio,
          fin: 1440
        });
      }


      if (
        turno.fecha === ayer &&
        fin <= inicio
      ) {

        resultado.push({
          inicio: 0,
          fin
        });
      }

    });


    return resultado;
  }


  function unirSegmentos(segmentos) {

    if (!segmentos.length) {
      return [];
    }


    const ordenados =
      [...segmentos]
      .sort(
        (a, b) =>
          a.inicio - b.inicio
      );


    const unidos = [
      {
        inicio: ordenados[0].inicio,
        fin: ordenados[0].fin
      }
    ];


    for (
      let i = 1;
      i < ordenados.length;
      i++
    ) {

      const actual =
        ordenados[i];

      const ultimo =
        unidos[unidos.length - 1];


      if (
        actual.inicio <= ultimo.fin
      ) {

        ultimo.fin =
          Math.max(
            ultimo.fin,
            actual.fin
          );
      }

      else {

        unidos.push({
          inicio: actual.inicio,
          fin: actual.fin
        });
      }
    }


    return unidos;
  }


  function calcularHuecos(segmentos) {

    const huecos = [];

    let cursor = 0;


    segmentos.forEach(segmento => {

      if (
        segmento.inicio > cursor
      ) {

        huecos.push({
          inicio: cursor,
          fin: segmento.inicio
        });
      }


      cursor =
        Math.max(
          cursor,
          segmento.fin
        );
    });


    if (cursor < 1440) {

      huecos.push({
        inicio: cursor,
        fin: 1440
      });
    }


    return huecos;
  }


  function formatoDuracion(minutosTotales) {

    const horas =
      Math.floor(
        minutosTotales / 60
      );

    const minutosRestantes =
      minutosTotales % 60;


    if (
      horas &&
      minutosRestantes
    ) {

      return `${horas} h ${minutosRestantes} min`;
    }


    if (horas) {

      return horas === 1
        ? "1 hora"
        : `${horas} horas`;
    }


    return `${minutosRestantes} min`;
  }


  function renderCobertura() {

    const segmentos =
      unirSegmentos(
        segmentosDelDia(
          fechaSeleccionada
        )
      );


    const cubiertos =
      segmentos.reduce(
        (total, segmento) =>
          total +
          (
            segmento.fin -
            segmento.inicio
          ),
        0
      );


    const faltantes =
      1440 - cubiertos;


    const porcentajeNumero =
      Math.round(
        cubiertos /
        1440 *
        100
      );


    porcentaje.textContent =
      `${porcentajeNumero}%`;


    barraInterior.style.width =
      `${porcentajeNumero}%`;


    textoCobertura.textContent =
      `${formatoDuracion(cubiertos)} cubiertas de 24 horas`;


    fechaSeleccionadaTexto.textContent =
      fechaBonita(
        fechaSeleccionada
      );


    const huecos =
      calcularHuecos(segmentos);


    if (!huecos.length) {

      detalleCobertura.innerHTML = `
        <div class="completo">
          ✅ ¡Las 24 horas están cubiertas!
        </div>
      `;

      return;
    }


    detalleCobertura.innerHTML = `
      <div class="faltantes">

        <strong>
          ⚠️ Falta cubrir ${formatoDuracion(faltantes)}
        </strong>

        ${huecos.map(hueco => `
          <div class="franja-faltante">
            ${horaBonita(hueco.inicio)}
            →
            ${horaBonita(hueco.fin)}
          </div>
        `).join("")}

      </div>
    `;
  }


  function turnosDelDia(fecha) {

    const ayer =
      sumarDias(fecha, -1);

    const resultado = [];


    Object.entries(turnos)
    .forEach(([id, turno]) => {

      const inicio =
        minutos(turno.inicio);

      const fin =
        minutos(turno.fin);


      if (
        turno.fecha === fecha
      ) {

        resultado.push({
          id,
          ...turno,
          orden: inicio,
          continuacion: false
        });
      }


      if (
        turno.fecha === ayer &&
        fin <= inicio
      ) {

        resultado.push({
          id,
          ...turno,
          orden: 0,
          continuacion: true
        });
      }

    });


    return resultado.sort(
      (a, b) =>
        a.orden - b.orden
    );
  }


  function limpiarTexto(texto) {

    const div =
      document.createElement("div");

    div.textContent =
      texto || "";

    return div.innerHTML;
  }


  function renderTurnos() {

    const lista =
      turnosDelDia(
        fechaSeleccionada
      );


    if (!lista.length) {

      listaTurnos.innerHTML = `
        <div class="vacio">
          Todavía nadie se ha apuntado para este día.
        </div>
      `;

      return;
    }


    listaTurnos.innerHTML =
      lista.map(turno => {

        let horario;


        if (turno.continuacion) {

          horario = `
            12:00 a. m.
            →
            ${horaDesdeTexto(turno.fin)}
            · continúa desde ayer
          `;
        }

        else {

          horario = `
            ${horaDesdeTexto(turno.inicio)}
            →
            ${horaDesdeTexto(turno.fin)}
          `;
        }


        return `
          <div class="turno">

            <div class="turno-arriba">

              <div>

                <div class="nombre">
                  👤 ${limpiarTexto(turno.nombre)}
                </div>

                <div class="horario">
                  🕐 ${horario}
                </div>

                ${
                  turno.nota
                  ? `
                    <div class="nota">
                      ${limpiarTexto(turno.nota)}
                    </div>
                  `
                  : ""
                }

              </div>

              <button
                class="eliminar"
                onclick="eliminarTurno('${turno.id}')">
                ✕
              </button>

            </div>

          </div>
        `;
      })
      .join("");
  }


  formulario.addEventListener(
    "submit",
    async evento => {

      evento.preventDefault();


      const nombre =
        document
          .getElementById("nombre")
          .value
          .trim();


      const inicio =
        document
          .getElementById("inicio")
          .value;


      const fin =
        document
          .getElementById("fin")
          .value;


      const nota =
        document
          .getElementById("nota")
          .value
          .trim();


      if (
        !nombre ||
        !inicio ||
        !fin
      ) {

        mostrarToast(
          "Completa nombre y horario"
        );

        return;
      }


      if (inicio === fin) {

        mostrarToast(
          "La hora de inicio y fin no pueden ser iguales"
        );

        return;
      }


      try {

        await push(
          turnosRef,
          {
            fecha: fechaSeleccionada,
            nombre,
            inicio,
            fin,
            nota,
            creado: Date.now()
          }
        );


        localStorage.setItem(
          "nombreMamiLinda",
          nombre
        );


        document
          .getElementById("nota")
          .value = "";


        mostrarToast(
          "✅ Turno confirmado"
        );
      }

      catch(error) {

        console.error(error);

        mostrarToast(
          "❌ No se pudo guardar"
        );
      }
    }
  );


  window.eliminarTurno =
    async function(id) {

      const confirmar =
        confirm(
          "¿Eliminar este turno?"
        );


      if (!confirmar) {
        return;
      }


      try {

        await remove(
          ref(
            db,
            `turnos/${id}`
          )
        );


        mostrarToast(
          "Turno eliminado"
        );
      }

      catch(error) {

        console.error(error);

        mostrarToast(
          "No se pudo eliminar"
        );
      }
    };


  function mostrarToast(texto) {

    const toast =
      document
        .getElementById("toast");


    toast.textContent =
      texto;


    toast.style.display =
      "block";


    setTimeout(
      () => {
        toast.style.display =
          "none";
      },
      2200
    );
  }


  function renderTodo() {

    renderDias();
    renderCobertura();
    renderTurnos();
  }


  onValue(
    turnosRef,

    snapshot => {

      turnos =
        snapshot.val() || {};


      estado.textContent =
        "🟢 Calendario actualizado en tiempo real";


      renderTodo();
    },

    error => {

      console.error(error);

      estado.textContent =
        "🔴 Error de conexión con Firebase";
    }
  );


  const nombreGuardado =
    localStorage.getItem(
      "nombreMamiLinda"
    );


  if (nombreGuardado) {

    document
      .getElementById("nombre")
      .value =
        nombreGuardado;
  }


  document
    .getElementById("inicio")
    .value =
      "08:00";


  document
    .getElementById("fin")
    .value =
      "12:00";


  renderDias();

</script>

</body>
</html>
